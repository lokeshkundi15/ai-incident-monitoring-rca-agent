version: '3.8'

services:
  rca-agent-ui:
    build: .
    container_name: rca_agent_app
    ports:
      - "8501:8501"
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data/simulated:/app/data/simulated
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 512M  # Capped strictly for 8GB RAM Laptop stability
    restart: always